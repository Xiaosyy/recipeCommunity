{% if button_type == 'button' %}<button class="ui-button ui-button--{{ variant|default('primary') }}{% if size %} ui-button--{{ size }}{% endif %}{% if extra_classes %} {{ extra_classes }}{% endif %}" type="{{ type|default('button') }}">{{ label }}</button>{% else %}<a class="ui-button ui-button--{{ variant|default('primary') }}{% if size %} ui-button--{{ size }}{% endif %}{% if extra_classes %} {{ extra_classes }}{% endif %}" href="{{ href }}"{% if spa_link %} data-spa-link{% endif %}>{{ label }}</a>{% endif %}
