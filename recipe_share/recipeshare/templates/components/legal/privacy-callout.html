<aside class="privacy-callout" aria-label="Privacy Commitment">
  <!-- Illustrated Shield with Botanical Leaves -->
  <div class="privacy-shield-illustration" aria-hidden="true">
    <svg viewBox="0 0 280 240" width="260" height="220" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Left side botanical leaves framing the shield -->
      <g class="privacy-leaves-left">
        <path d="M125 150C85 140 45 105 35 60C70 65 105 95 125 150Z" fill="#3D8A52" opacity="0.9" />
        <path d="M130 170C95 185 55 175 30 150C55 130 95 135 130 170Z" fill="#52A468" opacity="0.85" />
        <path d="M110 110C80 90 60 55 60 20C85 35 105 70 110 110Z" fill="#75BF8A" opacity="0.8" />
        <path d="M135 135C90 120 70 85 75 50C100 65 120 100 135 135Z" fill="#2E7042" opacity="0.8" />
      </g>

      <!-- Right side botanical leaves framing the shield -->
      <g class="privacy-leaves-right">
        <path d="M155 150C195 140 235 105 245 60C210 65 175 95 155 150Z" fill="#3D8A52" opacity="0.9" />
        <path d="M150 170C185 185 225 175 250 150C225 130 185 135 150 170Z" fill="#52A468" opacity="0.85" />
        <path d="M170 110C200 90 220 55 220 20C195 35 175 70 170 110Z" fill="#75BF8A" opacity="0.8" />
        <path d="M145 135C190 120 210 85 205 50C180 65 160 100 145 135Z" fill="#2E7042" opacity="0.8" />
      </g>

      <!-- Green Shield Shadow -->
      <path d="M140 206C185 184 214 136 214 74V38L140 18L66 38V74C66 136 95 184 140 206Z" fill="#0D381E" opacity="0.15" transform="translate(0, 6)" />

      <!-- Main Shield Outer Shape -->
      <path d="M140 206C185 184 214 136 214 74V38L140 18L66 38V74C66 136 95 184 140 206Z" fill="url(#shield-gradient-main)" stroke="#195B36" stroke-width="4" stroke-linejoin="round" />

      <!-- Inner Shield Highlight Contour -->
      <path d="M140 192C177 172 200 128 200 75V46L140 30L80 46V75C80 128 103 172 140 192Z" fill="none" stroke="#52A76D" stroke-width="2.5" opacity="0.5" />

      <!-- Crisp White Padlock Icon -->
      <g transform="translate(112, 68)">
        <!-- Shackle -->
        <path d="M14 26V18C14 11.4 19.4 6 26 6C32.6 6 38 11.4 38 18V26" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" />
        <!-- Lock Body -->
        <rect x="7" y="24" width="42" height="34" rx="7" fill="#FFFFFF" />
        <!-- Keyhole -->
        <circle cx="28" cy="38" r="4" fill="#1C5E37" />
        <path d="M26 38L24.5 48H31.5L30 38H26Z" fill="#1C5E37" />
      </g>

      <!-- Gradients -->
      <defs>
        <linearGradient id="shield-gradient-main" x1="66" y1="18" x2="214" y2="206" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2D7F4B" />
          <stop offset="45%" stop-color="#226A3D" />
          <stop offset="100%" stop-color="#154B2A" />
        </linearGradient>
      </defs>
    </svg>
  </div>

  <!-- Commitment Message Box -->
  <div class="privacy-commitment-card">
    <p class="privacy-commitment-text">We are committed to keeping your information safe and secure.</p>
    <div class="privacy-heart-divider" aria-hidden="true">
      <span class="privacy-heart-line"></span>
      <span class="privacy-heart-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="#2E7D46" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </span>
      <span class="privacy-heart-line"></span>
    </div>
  </div>
</aside>
