<div class="otp-field-group" data-otp-group>
  <label class="otp-group-label" for="otp_1">{{ label|default('6-Digit Verification Code') }}</label>
  <input type="hidden" id="otp_code" name="otp_code" value="" data-otp-combined>
  <div class="otp-digit-grid{% if error %} has-error{% endif %}" role="group" aria-label="{{ label|default('6-Digit Verification Code') }}">
    {% for index in range(1, 7) %}
    <input
      id="otp_{{ index }}"
      name="otp_{{ index }}"
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
      maxlength="1"
      autocomplete="{% if index == 1 %}one-time-code{% else %}off{% endif %}"
      class="otp-digit-input"
      data-otp-digit="{{ index }}"
      aria-label="Digit {{ index }} of 6"
      required
    >
    {% endfor %}
  </div>
  {% if error %}<small class="field-error otp-field-error" role="alert">{{ error }}</small>{% endif %}
</div>
