<div class="device-gmail-banner" data-device-gmail-banner data-target-email="{{ email or '' }}">
  <!-- Disconnected State -->
  <div class="device-gmail-state device-gmail-state--disconnected" data-device-gmail-disconnected {% if is_device_gmail_logged_in %}hidden{% endif %}>
    <div class="device-gmail-info">
      <span class="device-gmail-badge-icon device-gmail-badge-icon--muted" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="#889690" stroke-width="1.8"/>
          <path d="M22 6l-10 7L2 6" stroke="#889690" stroke-width="1.8"/>
        </svg>
      </span>
      <div class="device-gmail-text">
        <strong class="device-gmail-title">Gmail Not Logged In on this Device</strong>
        <p class="device-gmail-desc">
          OTP push notification &amp; auto-fill are only received if <strong>{{ masked_email or email or 'your Gmail' }}</strong> is logged in on this device.
        </p>
      </div>
    </div>
    <div class="device-gmail-actions">
      <button type="button" class="device-gmail-login-btn" data-device-gmail-btn="login" title="Simulate logging into your Gmail account on this device">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21.35 11.1h-9.17v2.98h5.27c-.23 1.25-.94 2.31-1.99 3.02v2.51h3.22c1.89-1.74 2.97-4.3 2.97-7.41 0-.71-.06-1.4-.2-2.1z" fill="#4285F4"/>
          <path d="M12.18 21c2.7 0 4.96-.9 6.62-2.43l-3.22-2.51c-.9.6-2.05.96-3.4.96-2.61 0-4.82-1.76-5.61-4.13H3.24v2.59C4.89 18.73 8.27 21 12.18 21z" fill="#34A853"/>
          <path d="M6.57 12.89c-.2-.6-.31-1.24-.31-1.89s.11-1.29.31-1.89V6.52H3.24C2.58 7.84 2.21 9.38 2.21 11s.37 3.16 1.03 4.48l3.33-2.59z" fill="#FBBC05"/>
          <path d="M12.18 4.96c1.47 0 2.79.51 3.83 1.5l2.87-2.87C17.13 1.94 14.88 1 12.18 1 8.27 1 4.89 3.27 3.24 6.52l3.33 2.59c.79-2.37 3-4.15 5.61-4.15z" fill="#EA4335"/>
        </svg>
        <span>Log In Gmail on this Device</span>
      </button>
    </div>
  </div>

  <!-- Connected State -->
  <div class="device-gmail-state device-gmail-state--connected" data-device-gmail-connected {% if not is_device_gmail_logged_in %}hidden{% endif %}>
    <div class="device-gmail-info">
      <span class="device-gmail-badge-icon device-gmail-badge-icon--active" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="#ea4335" stroke-width="2"/>
          <path d="M22 6l-10 7L2 6" stroke="#ea4335" stroke-width="2"/>
        </svg>
      </span>
      <div class="device-gmail-text">
        <div class="device-gmail-header-row">
          <strong class="device-gmail-title">Gmail Active on this Device</strong>
          <span class="device-gmail-tag">✓ Device Synced</span>
        </div>
        <p class="device-gmail-desc">
          <span class="device-gmail-active-email" data-device-gmail-email>{{ email or '' }}</span> is signed in on this device. Auto-fill notification enabled.
        </p>
      </div>
    </div>
    <div class="device-gmail-actions">
      <button type="button" class="device-gmail-logout-link" data-device-gmail-btn="logout" title="Simulate signing out of Gmail on this device">
        Log Out of Device
      </button>
    </div>
  </div>
</div>
