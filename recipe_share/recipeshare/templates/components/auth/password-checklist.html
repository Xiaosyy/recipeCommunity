<div class="password-strength-block" data-password-checklist{% if errors and errors.password %} data-password-has-error="true"{% endif %}>
  <div class="password-strength-meter">
    <span class="password-strength-title">Password Strength</span>
    <div class="password-strength-track" role="progressbar" aria-label="Password strength" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0" data-password-strength-track>
      <span class="password-strength-fill" data-password-strength-fill></span>
    </div>
    <span class="password-strength-status" data-password-strength-label></span>
  </div>
  <ul class="password-checklist" aria-live="polite" aria-label="Password requirements">
    <li class="password-rule" data-password-rule="length">
      <span class="password-rule-icon" aria-hidden="true"></span>
      <span>At least 8 characters</span>
    </li>
    <li class="password-rule" data-password-rule="case">
      <span class="password-rule-icon" aria-hidden="true"></span>
      <span>Uppercase and lowercase letters</span>
    </li>
    <li class="password-rule" data-password-rule="number">
      <span class="password-rule-icon" aria-hidden="true"></span>
      <span>Contains numbers</span>
    </li>
    <li class="password-rule" data-password-rule="special">
      <span class="password-rule-icon" aria-hidden="true"></span>
      <span>Contains special characters</span>
    </li>
  </ul>
</div>
